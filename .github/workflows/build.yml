name: Build macOS App (Monterey Compatible)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build_macos:
    # Menggunakan macOS 13 (Intel runner) agar aplikasi bisa berjalan lintas generasi Mac
    runs-on: macos-13 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow requests pyinstaller

    - name: Build with PyInstaller
      env:
        # Memaksa target minimum sistem operasi ke macOS Monterey (12.0)
        MACOSX_DEPLOYMENT_TARGET: "12.0"
      run: |
        cd "Hyperdeck & Framesync Control"
        python -m PyInstaller --name "BMD HyperDeck Control" \
                    --windowed \
                    --icon="logo.icns" \
                    --add-data "logo.icns:." \
                    --add-data "logo.ico:." \
                    main.py

    - name: Zip the .app Bundle
      run: |
        cd "Hyperdeck & Framesync Control/dist"
        zip -r "BMD_HyperDeck_Control_macOS.zip" "BMD HyperDeck Control.app"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BMD-HyperDeck-Control-macOS
        path: Hyperdeck & Framesync Control/dist/BMD_HyperDeck_Control_macOS.zip
